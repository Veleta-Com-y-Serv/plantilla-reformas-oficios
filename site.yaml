  zonas:
    activa: true
    antetitulo: Dónde trabajamos
    titulo: Tarazona y 40 km alrededor
    texto: "Moncayo, Campo de Borja y la zona de Ágreda. Si tu pueblo no está, pregúntanos."
    imagen: /fotos/comarca.jpg
    titulo_pagina: "Reformas en {zona}"
    texto_pagina: "Albañiles, fontaneros, electricistas y pintores propios en {zona}. Precio cerrado por escrito y fecha de entrega que se cumple."
    items:
      - titulo: Tarazona
        texto: "Es nuestra casa: aquí tenemos el taller, en la Avenida de la Paz, y aquí hemos hecho buena parte de nuestras obras, desde pisos del ensanche hasta casas del casco antiguo con muros de piedra y vigas de madera. Reformamos cocinas y baños, renovamos instalaciones de luz y agua y rehabilitamos tejados y fachadas respetando el aspecto del barrio. Si tienes una urgencia en Tarazona, llegamos antes que nadie."
      - titulo: Borja
        texto: "Trabajamos a menudo en Borja y en los pueblos del Campo de Borja, como Ainzón. Muchas de las casas son de pueblo, con patios, bodegas y tejados de teja árabe que piden cuidado; otras son pisos que se quieren poner al día. Hacemos reformas integrales, baños con plato de ducha, cocinas nuevas y arreglos de tejado. Vamos a ver la obra sin compromiso y te damos el presupuesto cerrado por escrito."
      - titulo: Ágreda
        texto: "Aunque Ágreda ya es Soria, está a un paso de nuestro taller y trabajamos allí con frecuencia. Conocemos bien sus casas de piedra y los inviernos fríos del Moncayo, así que cuidamos especialmente el aislamiento de tejados y fachadas, las calefacciones y las instalaciones de agua que tienen que aguantar las heladas. También hacemos baños, cocinas y reformas completas de pisos y casas."
      - titulo: Novallas
        texto: "En Novallas, junto a Tarazona, hemos rehabilitado fachadas de casas de pueblo, reformado baños y cocinas y atendido urgencias de fontanería un domingo cualquiera. Al estar tan cerca, podemos ir a ver tu obra el mismo día y organizar los trabajos con poco margen. Trabajamos también en Malón y Torrellas, los pueblos de alrededor. Cuéntanos qué necesitas y te damos fecha."
      - { titulo: Malón }
      - titulo: Vera de Moncayo
        texto: "Vera de Moncayo y los pueblos al pie del Moncayo, como Grisel y Los Fayos, tienen casas con mucha historia y tejados que sufren con la nieve y el viento. Aquí hacemos sobre todo rehabilitación de tejados con aislamiento, fachadas de piedra y reformas para convertir casas antiguas en viviendas cómodas para todo el año, sin perder su carácter."
      - { titulo: Torrellas }
      - { titulo: Los Fayos }
      - { titulo: Grisel }
      - { titulo: Ainzón }

