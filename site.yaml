  servicios:
    activa: true
    antetitulo: Servicios
    titulo: Todo lo que necesita tu casa
    texto: "Un solo equipo para toda la obra. Sin ir llamando a cinco gremios."
    items:
      - titulo: Reformas integrales
        texto: "Pisos y casas completas, con proyecto y licencia."
        icono: casa
        imagenes: "/fotos/hero.jpg; /fotos/taller.jpg"
        detalle: |
          Una reforma integral es poner la casa patas arriba para dejarla como siempre la has querido: distribución nueva, instalaciones de agua y luz al día, suelos, carpinterías y pintura. Hacerla con un solo equipo evita lo peor de las obras: gremios que no se hablan, fechas que se encadenan y un presupuesto que crece cada semana.

          Empezamos con una visita para ver la vivienda contigo, medir y escuchar qué necesitas. Con eso preparamos el proyecto y el presupuesto cerrado por escrito, con las fechas de cada fase. Si la obra necesita licencia o comunicación al ayuntamiento, nos encargamos del papeleo.

          Durante la obra tienes un encargado que la sigue de principio a fin y te cuenta cada viernes cómo va. Trabajamos con albañiles, fontaneros, electricistas, carpinteros y pintores propios, así que el orden de los trabajos lo marcamos nosotros y no hay esperas entre gremios. Al terminar repasamos todo contigo, limpiamos y te entregamos la casa lista para vivir, con la garantía por escrito.
      - titulo: Cocinas
        texto: "Muebles, encimeras, azulejos e instalación nueva."
        icono: cocina
        imagenes: "/fotos/trabajo-cocina.jpg; /fotos/trabajo-cocina-antes.jpg"
        detalle: |
          La cocina es donde más se nota una reforma y donde más cosas tienen que encajar: muebles, electrodomésticos, enchufes, tomas de agua, salida de humos y luz. Por eso la planteamos entera, desde la distribución hasta el último tirador, para que funcione bien en el día a día.

          En la visita medimos, vemos cómo cocinas y te proponemos opciones: abrirla al salón, ganar encimera, cambiar la isla de sitio o aprovechar mejor un rincón. Elegimos contigo los muebles, la encimera y el revestimiento, y renovamos la fontanería y la electricidad para que todo quede a la medida de lo que vas a poner.

          Retiramos la cocina vieja, hacemos la obra, montamos los muebles y dejamos los electrodomésticos conectados y probados. Mientras dura, organizamos el trabajo para que puedas seguir en casa siempre que sea posible, y recogemos cada día. El precio es cerrado y la fecha de entrega la sabes antes de empezar.
      - titulo: Baños
        texto: "Cambiamos la bañera por plato de ducha en dos días."
        icono: ducha
        imagenes: "/fotos/trabajo-bano.jpg; /fotos/trabajo-bano-antes.jpg"
        detalle: |
          Cambiar la bañera por un plato de ducha es el trabajo que más nos piden, y con razón: el baño gana espacio, es más seguro para entrar y salir y se limpia mucho mejor. Lo hacemos en muy poco tiempo, sin tener que levantar todo el baño si no hace falta.

          Si prefieres una reforma completa, cambiamos también azulejos, suelo, sanitarios, mueble de lavabo y grifería, y revisamos las tuberías para que no haya sorpresas detrás de los azulejos nuevos. Te ayudamos a elegir materiales que aguanten la humedad y sean fáciles de mantener.

          Antes de empezar te damos el presupuesto cerrado y la fecha de fin. Protegemos el resto de la casa del polvo, trabajamos con orden y, al acabar, dejamos el baño limpio y listo para usar. Todos los trabajos tienen garantía por escrito: si algo falla, volvemos sin coste.
      - titulo: Fontanería
        texto: "Tuberías, calentadores, fugas y desatascos."
        icono: grifo
        detalle: |
          Atendemos desde una fuga pequeña hasta la instalación completa de una vivienda. Cambiamos tuberías antiguas de hierro o plomo, instalamos y revisamos calentadores y termos, sustituimos grifos y cisternas, y desatascamos desagües.

          Si tienes una urgencia, como una fuga de agua o una tubería reventada, llámanos: te devolvemos la llamada en menos de una hora y te decimos cuándo podemos estar en tu casa. Mientras llegamos, te explicamos por teléfono cómo cerrar el agua para que el daño no vaya a más.

          En las reformas renovamos la instalación entera para que quede preparada para años, con llaves de corte por estancias y materiales actuales. Te damos el precio antes de empezar y, al terminar, probamos la instalación contigo y te explicamos dónde están las llaves de paso.
      - { titulo: Electricidad, texto: "Cuadros, boletines, puntos de luz y cargadores.", icono: enchufe }
      - { titulo: Pintura, texto: "Interiores, fachadas y alisado de gotelé.", icono: rodillo }
      - { titulo: Carpintería y ventanas, texto: "Puertas, armarios y ventanas de PVC o aluminio.", icono: ventana }
      - titulo: Tejados y fachadas
        texto: "Goteras, aislamiento y rehabilitación."
        icono: ladrillo
        imagenes: "/fotos/trabajo-tejado.jpg; /fotos/trabajo-tejado-antes.jpg; /fotos/trabajo-fachada.jpg"
        detalle: |
          Una gotera rara vez se arregla sola: el agua que entra por una teja rota acaba pudriendo vigas, manchando techos y estropeando el aislamiento. En las casas de pueblo de la comarca, con tejados de teja árabe y muros de piedra, conviene revisarlos antes de que el problema crezca.

          Subimos a ver el tejado, te enseñamos fotos de lo que encontramos y te proponemos la solución: retejar, cambiar el canalón, impermeabilizar o rehacer la cubierta con aislamiento nuevo. Montamos el andamio y las protecciones necesarias y trabajamos con seguridad.

          En las fachadas picamos y rejuntamos la piedra, reparamos grietas, aislamos por fuera si hace falta y pintamos carpinterías y aleros. Respetamos el aspecto de la casa y del pueblo, y pedimos los permisos que hagan falta en el ayuntamiento antes de empezar.

